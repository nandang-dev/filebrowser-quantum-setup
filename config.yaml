# Konfigurasi FileBrowser Quantum v1.5.x (image gtstef/filebrowser:stable).
# Format mengikuti backend/config.yaml pada tag v1.5.6-stable. Catatan: dokumentasi/branch main
# memakai format v2 (mis. blok `http:`) yang TIDAK dikenali versi stable.
# Password admin TIDAK ditulis di sini: pakai env FILEBROWSER_ADMIN_PASSWORD.
server:
  port: 80
  baseURL: "/"
  logging:
    - levels: "info|warning|error"
  sources:
    # Satu-satunya folder yang bisa diakses: folder model deteksi.
    # Isi: <nama-model>/<nama-model>.onnx + model-card.json
    - path: "/srv"
      config:
        defaultEnabled: true
frontend:
  name: "Planogram – Model Deteksi"
  disableDefaultLinks: true
auth:
  methods:
    password:
      enabled: true
      minLength: 12
      signup: false
    passkey:
      enabled: false
