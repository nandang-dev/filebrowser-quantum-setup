# FileBrowser Quantum untuk mengelola file model deteksi (.onnx) Stack Inspection API.
# Deploy di Coolify: New Resource → Docker Compose → repo ini. Lihat README.md.
services:
  filebrowser:
    # Build the v1.5.8 image with the subpath config baked in; avoid host file mounts.
    image: filebrowser-quantum:1.5.8-files
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      # Folder model yang sama di-mount READ-ONLY ke Stack Inspection API (/app/models)
      - ${MODELS_HOST_DIR:-/data/stack-inspection/models}:/srv
      # Database akun & pengaturan FileBrowser
      - ${FILEBROWSER_DB_HOST_DIR:-/data/filebrowser-quantum}:/home/filebrowser/db
    environment:
      # Coolify routes the domain to container port 80; expose it internally only.
      - SERVICE_FQDN_FILEBROWSER_80
      # Password admin dari Environment Variables Coolify (JANGAN ditulis di repo).
      # Direset ke nilai ini setiap start, jadi kalau lupa cukup lihat/ganti di Coolify lalu restart.
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD:?isi FILEBROWSER_ADMIN_PASSWORD di Coolify}
      - FILEBROWSER_DATABASE=/home/filebrowser/db/database.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/files/health"]
      interval: 30s
      timeout: 5s
      retries: 3
